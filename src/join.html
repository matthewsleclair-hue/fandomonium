<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c0711">
<title>Join Fandomonium</title>
<link rel="icon" href="../icon.png">
<style>
/*FONTS*/
/* VOICE occasion: the controller in your hand at game night, loud and obvious at arm's length
   IDEA an admit-one ticket and a big arcade buzzer: your team colour runs through everything
   PICTURE the live control itself (answer buttons, buzzer, fandom cards) filling the screen
   COLOUR velvet red ground, ivory card, butter accents, your team's colour on the ticket and buzzer
   TYPE Bungee for headings and buttons + Rubik for reading
   LAYOUT one column: top bar, team ticket, the control; thumbs reach everything */
:root{color-scheme:dark;--v1:#4c0711;--v2:#7a0d1e;--v3:#a3172c;--iv:#fff8ec;--iv2:#f4e7d0;--line:#e5d6bb;--ink:#24110f;--mut:#6f5753;--but:#ffd23f;--ok:#12854f;--no:#c8233a;--c:#ffd23f;--disp:'Bungee',Impact,'Arial Black',sans-serif;--notch:radial-gradient(circle 9px at 0 50%,#0000 96%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 96%,#000) right/51% 100% no-repeat}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 50% at 50% -10%,rgba(255,210,63,.2),transparent 60%),repeating-linear-gradient(90deg,var(--v1) 0,var(--v2) 22px,var(--v3) 36px,var(--v2) 50px,var(--v1) 72px);background-color:var(--v1);color:#fff;font:17px/1.45 Rubik,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit}
button{cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--but);outline-offset:2px}
[hidden]{display:none!important}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.logo{font-family:var(--disp);font-size:18px;color:var(--but);text-shadow:0 0 12px rgba(255,210,63,.5)}
.room{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#ffe7c0}
.room b{font-family:var(--disp);font-weight:400;font-size:16px;color:#fff;letter-spacing:.04em}
.dot{width:10px;height:10px;border-radius:50%;background:#c9b48f}
.dot.up{background:#35d27f;box-shadow:0 0 0 3px rgba(53,210,127,.25)}
.dot.down{background:var(--no)}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 10px 20px;border-radius:8px;background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--c);color:var(--ink);-webkit-mask:var(--notch);mask:var(--notch)}
.me b{display:block;font-size:17px;line-height:1.2}
.me small{display:block;font-size:13px;opacity:.8}
.me .sc{font-family:var(--disp);font-size:26px;border-left:2px dashed rgba(36,17,15,.35);padding-left:12px;white-space:nowrap}
.card{flex:1;display:flex;flex-direction:column;gap:14px;background:var(--iv);color:var(--ink);border-radius:20px;padding:20px 18px;box-shadow:0 8px 0 #2a040a,0 20px 40px rgba(0,0,0,.35);animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
h1,h2{font-family:var(--disp);font-weight:400;line-height:1.05;margin:0;color:var(--v2);text-wrap:balance}
h1{font-size:clamp(30px,9vw,42px)}
h2{font-size:clamp(24px,7vw,32px)}
p{margin:0}
.hint{color:var(--mut);font-size:15px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:10px 0}
.qtext{font-size:clamp(18px,5vw,22px);font-weight:700;line-height:1.25}
.sub{color:var(--mut);font-size:16px}
label{display:grid;gap:6px;font-weight:600;font-size:15px;color:var(--mut)}
input{width:100%;min-height:56px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:600}
#rc{font-family:var(--disp);font-size:30px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.big{min-height:62px;padding:0 20px;border:0;border-radius:16px;font-family:var(--disp);font-size:21px;color:var(--but);background:linear-gradient(#a8192f,#7a0d1e);text-shadow:0 2px 0 #3a0610;box-shadow:0 5px 0 #4c0711;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #4c0711}
.big:disabled{opacity:.5}
.err{color:var(--no);font-weight:600;min-height:1.4em}
.teams,.cats,.ans{display:grid;gap:10px}
.tbtn,.cbtn,.abtn{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:18px;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
.tbtn:active,.cbtn:active,.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tbtn{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--c);border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tbtn.on{outline:4px solid var(--ink);outline-offset:2px}
.tbtn .ck{margin-left:auto;font-size:14px;font-weight:600;background:var(--ink);color:var(--but);padding:4px 10px;border-radius:999px}
.cbtn{min-height:84px;font-size:21px;border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.cbtn i{width:16px;height:44px;border-radius:5px;background:var(--c);flex:none}
.abtn b{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--iv2);font-family:var(--disp);font-weight:400;font-size:15px}
.abtn:disabled{opacity:.35;text-decoration:line-through}
.abtn.sel{opacity:1;text-decoration:none;border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.abtn.sel b{background:var(--ink);color:var(--but)}
.ans.done .abtn:not(.sel){opacity:.4}
.seq .abtn b{background:var(--ink);color:var(--but)}
.seq .abtn.un b{background:var(--iv2);color:var(--ink)}
.timer{display:flex;align-items:center;gap:10px}
.timer .tb{flex:1;height:12px;border-radius:99px;background:#ead9bb;overflow:hidden}
.timer .tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffae22,var(--but));transform-origin:left;border-radius:inherit}
.timer .tm{font-family:var(--disp);font-size:18px;width:2ch;text-align:right;color:var(--v2)}
.buzzwrap{flex:1;display:grid;place-items:center;gap:14px;padding:10px 0}
.buzzer{width:min(76vw,320px);aspect-ratio:1;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--disp);font-size:clamp(34px,11vw,52px);color:var(--ink);background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.75) 0 10%,transparent 11%),radial-gradient(circle at 50% 42%,var(--c),color-mix(in srgb,var(--c) 64%,#000));box-shadow:0 14px 0 color-mix(in srgb,var(--c) 40%,#000),0 22px 36px rgba(0,0,0,.4);transition:transform .07s,box-shadow .07s;user-select:none;-webkit-user-select:none}
.buzzer:active,.buzzer.hit{transform:translateY(10px);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#000),0 8px 14px rgba(0,0,0,.4)}
.buzzer:disabled{filter:grayscale(1) brightness(.6)}
.blanks{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center}
.blanks span{display:flex;gap:4px}
.blanks i{width:18px;height:4px;border-radius:2px;background:var(--ink);display:block;margin-top:14px}
.mark{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:700;color:#fff;background:#b9a688;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.mark.ok{background:var(--ok)}
.mark.bad{background:var(--no)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.place{font-family:var(--disp);font-size:clamp(56px,18vw,88px);line-height:1;color:var(--v2)}
.mx{display:flex;gap:8px;align-items:baseline;justify-content:center;max-width:34ch;margin:0 auto;font-style:italic;color:var(--ink);font-size:15px;line-height:1.4}
.mx b{flex:none;font-family:var(--disp);font-weight:400;font-style:normal;font-size:12px;line-height:1;padding:5px 8px 4px;border-radius:999px;background:var(--v2);color:var(--but)}
.ditem{font-size:clamp(26px,8vw,36px);font-weight:800;line-height:1.1;text-align:center;margin:4px 0;text-wrap:balance;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.dod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbtn{min-height:130px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--v2);font-weight:800;font-size:clamp(18px,5.6vw,25px);line-height:1.15;overflow-wrap:anywhere;padding:10px;box-shadow:0 5px 0 var(--line);text-wrap:balance;transition:transform .1s,box-shadow .1s}
.dbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.dbtn:disabled{opacity:.4}
.dbtn.sel{opacity:1;border-color:var(--ink);background:var(--ink);color:var(--but);box-shadow:0 5px 0 #000}
.sabbox{display:grid;gap:8px;padding:12px 14px;border-radius:16px;border:2px dashed var(--no);background:#fff1f2}
.sabbox h3{margin:0;font-family:var(--disp);font-weight:400;font-size:18px;color:var(--no)}
.sabbox div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{min-height:56px;padding:6px 10px;border-radius:12px;border:0;background:var(--no);color:#fff;font-weight:700;font-size:15px;line-height:1.2;box-shadow:0 4px 0 #7d1322}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1322}
.sbtn:disabled{opacity:.45}
.ribbon{padding:8px 12px;border-radius:12px;background:repeating-linear-gradient(-45deg,var(--no) 0 12px,#9e1a2d 12px 24px);color:#fff;font-family:var(--disp);font-size:16px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.lifes{display:flex;gap:8px}
.lbtn{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--ok);background:#dcf3e6;color:#0a5533;font-weight:700;font-size:15px}
.lbtn:disabled{opacity:.4}
.repbox{width:100%;margin-top:8px;color:var(--mut);font-size:14px;text-align:left}
.repbox summary{cursor:pointer;text-align:center;min-height:32px}
.repbox div{display:flex;gap:8px;margin-top:8px}
.repbox input{min-height:44px;font-size:16px}
.repbox button{flex:none;min-height:44px;padding:0 14px;border-radius:10px;border:0;background:var(--ink);color:var(--but);font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><span class="logo">Fandomonium</span><span class="room" id="roomline" hidden>Room <b id="roomcode"></b><span class="dot" id="dot"></span></span></div>
  <div class="me" id="me" hidden><div><b id="myteam"></b><small id="myname"></small></div><span class="sc" id="myscore">0</span></div>
  <main class="card" id="view"></main>
</div>
<script>/*MQTT*/</script>
<script>/*NET*/</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const clean=s=>String(s||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
const P={room:"",name:"",pid:"",c:null,v:null,key:"",local:{},deadline:0,dur:0,ping:0};
const qs=new URLSearchParams(location.search);
P.room=clean(qs.get("r")||location.hash.slice(1));
P.name=store.get("fdm-name","");
const T=s=>NET.prefix+P.room+"/"+s;
function urls(){const o=NET.override();if(o)return [o];const l=NET.brokers.slice(),b=Number(qs.get("b"));if(b>=0&&b<l.length){const [x]=l.splice(b,1);l.unshift(x);}return l;}
let lastKind="";
function card(html,kind){const v=$("#view");kind=kind||html.slice(0,40);if(kind!==lastKind){v.style.animation="none";void v.offsetWidth;v.style.animation="";lastKind=kind;}v.innerHTML=html;}
function dot(s){$("#dot").className="dot "+s;}
function send(m){NET.log("send",m.t);if(P.c)P.c.publish(T("h"),JSON.stringify(Object.assign({pid:P.pid},m)),{qos:1});}

/* ---------- joining ---------- */
function form(err){$("#me").hidden=true;
 card(`<h1>Join the game</h1><p class="sub">Enter the room code on the TV.</p>
 <form id="jf" class="teams" autocomplete="off"><label>Room code<input id="rc" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" value="${esc(P.room)}" placeholder="ABCD"></label>
 <label>Your name<input id="nm" maxlength="16" autocorrect="off" value="${esc(P.name)}" placeholder="Name"></label>
 <button class="big" type="submit">Join</button><p class="err" id="err">${esc(err||"")}</p></form>`);
 $("#jf").addEventListener("submit",e=>{e.preventDefault();join();});
 (P.room?$("#nm"):$("#rc")).focus();}
async function join(){const rc=$("#rc"),nm=$("#nm");
 if(rc)P.room=clean(rc.value);if(nm)P.name=nm.value.trim().slice(0,16);
 if(P.room.length!==4){form("Room codes are 4 letters.");return;}
 if(!P.name){form("Add your name so your team knows who you are.");return;}
 store.set("fdm-name",P.name);
 P.pid=store.get("fdm-pid-"+P.room,"")||NET.id();store.set("fdm-pid-"+P.room,P.pid);
 card(`<div class="center"><h2>Finding room ${esc(P.room)}…</h2><p class="sub">Hang on a second.</p></div>`);
 if(typeof mqtt==="undefined"){form("Couldn’t load the game. Check your connection and reload.");return;}
 for(const u of urls()){const c=await NET.connectOne(u);if(!c)continue;if(await hasHost(c)){attach(c);return;}try{c.end(true);}catch(e){}}
 form(navigator.onLine===false?"You’re offline. Connect to Wi-Fi or data and try again.":`Couldn’t find room ${P.room}. Check the code on the TV.`);}
// The room exists if the TV's retained hello arrives, or if the TV answers a direct probe
// (some relays don't replay retained messages reliably).
function hasHost(c){return new Promise(res=>{const top=T("hello"),mine=T("p/"+P.pid);let done=false,t=0;
 const h=(tp,b)=>{if(tp===mine){NET.log("probe answered");fin(true);return;}if(tp!==top)return;const s=b.toString();NET.log("hello",s.slice(0,80));if(!s)return;try{const m=JSON.parse(s);if(Date.now()-m.ts<180000)fin(true);}catch(e){}};
 const fin=v=>{if(done)return;done=true;clearTimeout(t);c.removeListener("message",h);res(v);};
 c.on("message",h);
 c.subscribe([top,mine],{qos:1},()=>{try{c.publish(T("h"),JSON.stringify({pid:P.pid,t:"probe"}),{qos:1});}catch(e){}});
 t=setTimeout(()=>{NET.log("no answer");fin(false);},5000);});}
function attach(c){P.c=c;$("#roomline").hidden=false;$("#roomcode").textContent=P.room;dot("up");
 c.on("message",(tp,b)=>{const s=b.toString();
  if(tp===T("hello")){if(!s)ended();return;}
  if(tp!==T("p/"+P.pid))return;let v;try{v=JSON.parse(s);}catch(e){return;}
  if(v.v==="rejoin"){sendJoin();return;}
  NET.log("view",v.v);
  // A repeat of the screen we already show (the relay can deliver twice): just resync the countdown.
  const key=JSON.stringify(Object.assign({},v,{secs:0}));
  if(key===P.key){if(v.secs!=null)P.deadline=Date.now()+v.secs*1000;return;}
  const same=v.id&&P.v&&P.v.id===v.id;P.key=key;P.v=v;if(!same)P.local={};render();});
 c.subscribe(T("p/"+P.pid),{qos:1});
 c.on("connect",()=>{dot("up");P.key="";send({t:"ping",need:true});});
 c.on("offline",()=>dot("down"));c.on("reconnect",()=>dot(""));
 sendJoin();clearInterval(P.ping);P.ping=setInterval(()=>send({t:"ping"}),10000);
 card(`<div class="center"><h2>Joining…</h2></div>`);wake();}
function sendJoin(){send({t:"join",name:P.name,team:store.get("fdm-team-"+P.room,null)});}
function ended(){clearInterval(P.ping);P.v=null;$("#me").hidden=true;dot("down");
 card(`<div class="center"><h2>The game has ended</h2><p class="sub">Thanks for playing! When the host starts a new game, join with the new code.</p><button class="big" data-a="again">Join another game</button></div>`);}
async function wake(){try{if(navigator.wakeLock)P.lock=await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&P.c){wake();send({t:"ping",need:true});}});

/* ---------- views ---------- */
function timer(secs){P.dur=Math.max(1,secs||0);P.deadline=Date.now()+P.dur*1000;return `<div class="timer"><div class="tb"><i id="ti"></i></div><span class="tm" id="tm">${Math.ceil(P.dur)}</span></div>`;}
setInterval(()=>{const i=$("#ti");if(!i)return;const left=Math.max(0,(P.deadline-Date.now())/1000);i.style.transform=`scaleX(${(left/P.dur).toFixed(3)})`;const t=$("#tm");if(t)t.textContent=Math.ceil(left);},200);
const lifes=v=>{const l=v.life||{};const b=[["half","50/50"],["time","+10 seconds"]].filter(([k])=>l[k]);return b.length?`<div class="lifes">${b.map(([k,t])=>`<button class="lbtn" data-a="life" data-v="${k}">${t}</button>`).join("")}</div>`:"";};
const mx=h=>h?`<p class="mx"><b>Max</b><span>${esc(h)}</span></p>`:"";
const rib=v=>v.sabBy?`<div class="ribbon">${v.sabK==="rush"?"Timer slashed":"Scrambled"} by ${esc(v.sabBy)}!</div>`:"";
function render(){const v=P.v;if(!v)return;const K=v.v+(v.q||v.msg||v.item||"");const card_=card;const card2=h=>card_(h,K);
 const tm=v.teams&&v.teams[v.team];
 if(tm){document.documentElement.style.setProperty("--c",tm.color);$("#me").hidden=false;$("#myteam").textContent=tm.name;$("#myname").textContent=P.name+(v.vip?" ★ VIP":"");$("#myscore").textContent=v.score;store.set("fdm-team-"+P.room,v.team);}
 const vip=v.vip;
 switch(v.v){
  case "lobby":card2(`<h2>You’re in, ${esc(P.name)}!</h2><p class="sub">Pick your team:</p><div class="teams">${v.teams.map((t,i)=>`<button class="tbtn${i===v.team?" on":""}" style="--c:${t.color}" data-a="team" data-v="${i}">${esc(t.name)}${i===v.team?'<span class="ck">Your team</span>':""}</button>`).join("")}</div>
   ${vip?`<button class="big" data-a="start">Everyone’s in. Start!</button><p class="hint">You’re the VIP: you start the game and move things along from your phone.</p>`:`<p class="hint">Waiting for the VIP to start the game…</p>`}`);break;
  case "wait":card2(`<div class="center"><h2>${esc(v.msg)}</h2>${v.sub?`<p class="sub">${esc(v.sub)}</p>`:""}</div>${v.sab?`<div class="sabbox"><h3>Screw your neighbour</h3><p class="hint">One use per game. Mess with ${esc(v.victim)}:</p><div><button class="sbtn" data-a="sab" data-v="scr">Scramble their question</button><button class="sbtn" data-a="sab" data-v="rush">Slash their timer</button></div></div>`:""}`);break;
  case "ready":card2(`<div class="center"><h2>${esc(v.msg)}</h2><p class="sub">${esc(v.sub||"")}</p>${vip?`<button class="big" data-a="ready">Start the round</button>`:`<p class="hint">The VIP starts the round.</p>`}</div>`);break;
  case "cat":card2(`<h2>Pick a fandom</h2>${timer(v.secs)}<div class="cats">${v.opts.map(o=>`<button class="cbtn" style="--c:${o.c}" data-a="cat" data-v="${esc(o.k)}"><i></i>${esc(o.n)}</button>`).join("")}</div>`);break;
  case "mc":{const st=v.struck||[];card2(`${rib(v)}<p class="qtext">${esc(v.q)}</p>${timer(v.secs)}<div class="ans" id="ans">${v.ch.map((t,i)=>`<button class="abtn" data-a="pick" data-v="${i}"${st.includes(i)?" disabled":""}><b>${"ABCD"[i]}</b><span>${esc(t)}</span></button>`).join("")}</div>${lifes(v)}<p class="hint" id="note">Worth ${esc(v.pts)} points.</p>`);break;}
  case "seq":{const o=P.local.order||(P.local.order=[]);card2(`${rib(v)}<p class="qtext">${esc(v.q)}</p>${timer(v.secs)}<p class="hint">Tap from first to last. Tap again to undo.</p><div class="ans seq" id="ans">${v.items.map((t,i)=>{const p=o.indexOf(i);return `<button class="abtn${p<0?" un":""}" data-a="seq" data-v="${i}"${P.local.sent?" disabled":""}><b>${p<0?"":p+1}</b><span>${esc(t)}</span></button>`;}).join("")}</div>${lifes(v)}`);break;}
  case "rapid":{const lk=P.local.sent;card2(`<p class="hint" style="text-align:center">Rapid Fire · ${esc(v.cat)} · ${esc(v.right)} right, ${esc(v.wrong)} wrong</p><p class="qtext">${esc(v.q)}</p>${timer(v.secs)}<div class="ans" id="ans">${v.ch.map((t,i)=>`<button class="abtn${P.local.pick===i?" sel":""}" data-a="rpick" data-v="${i}"${lk?" disabled":""}><b>${"AB"[i]}</b><span>${esc(t)}</span></button>`).join("")}</div>`);break;}
  case "hilo":{const lk=v.lock||P.local.sent;card2(`<p class="hint" style="text-align:center">Higher or Lower · call ${v.k} of ${v.n}</p><p class="ditem">${esc(v.item)}</p><p class="sub" style="text-align:center">Earlier or later than ${esc(v.prev)}?</p>${timer(v.secs)}<div class="dod">${["Earlier","Later"].map((t,i)=>`<button class="dbtn${P.local.pick===i?" sel":""}" data-a="hpick" data-v="${i}"${lk?" disabled":""}>${i?"Later →":"← Earlier"}</button>`).join("")}</div>`);break;}
  case "dod":{const lk=v.done||P.local.sent;card2(`<p class="hint" style="text-align:center">Final Gauntlet · ${v.k+1} of ${v.n}</p><p class="ditem">${esc(v.item)}</p>${timer(v.secs)}<div class="dod">${[v.a,v.b].map((t,i)=>`<button class="dbtn${P.local.pick===i?" sel":""}" data-a="dod" data-v="${i}"${lk?" disabled":""}>${esc(t)}</button>`).join("")}</div><p class="hint" id="note" style="text-align:center">${lk?"Locked in. Eyes on the TV!":"+100 if you’re right, −50 if you’re wrong."}</p>`);break;}
  case "dodres":card2(`<div class="center"><div class="mark${v.ok===true?" ok":v.ok===false?" bad":""}">${v.ok===true?"✓":v.ok===false?"✗":"–"}</div><h2>${esc(v.right)}!</h2><p class="sub">${esc(v.item)}: ${v.ok==null?"your team passed.":v.ok?"+100 for your team.":"−50 for your team."}</p><p class="hint">Call ${v.k+1} of ${v.n}</p></div>`);if(v.ok&&navigator.vibrate)navigator.vibrate(40);break;
  case "buzz":card2(`<div class="buzzwrap">${v.steal?`<div class="center" style="flex:0;padding:0"><h2>Steal it!</h2><p class="sub">Buzz first to steal for ${esc(v.val)}.</p></div>`:""}<button class="buzzer" id="bz" data-a="buzz"${v.locked?" disabled":""}>${v.locked?"Locked":v.steal?"Steal":"Buzz"}</button><p class="sub">${v.locked?"You’re locked out of this one.":v.steal?"Only if you know it: a wrong steal scores nothing.":"Buzz the second you know it."}</p></div>`);break;
  case "type":card2(`<h2>You buzzed in!</h2><p class="sub">${esc(v.hint)}: type your answer.</p><div class="blanks">${(v.words||[]).map(n=>`<span>${"<i></i>".repeat(n)}</span>`).join("")}</div>${timer(v.secs)}<form id="tf" class="teams" autocomplete="off"><input id="ta" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Your answer"><button class="big" type="submit">Send</button></form>`);
   $("#tf").addEventListener("submit",e=>{e.preventDefault();const t=$("#ta").value.trim();if(!t)return;send({t:"type",text:t});card2(`<div class="center"><h2>Sent!</h2><p class="sub">Look at the TV.</p></div>`);});$("#ta").focus();break;
  case "res":card2(`<div class="center">${v.mine?`<div class="mark${v.ok?" ok":" bad"}">${v.ok?"✓":"✗"}</div><h2>${v.ok?"Nice!":"Not this time"}</h2><p class="sub">${esc(v.text)}</p>`:`<h2>${esc(v.text)}</h2>`}${mx(v.host)}${vip?`<button class="big" data-a="next">Next</button>`:`<p class="hint">The VIP moves things along.</p>`}${v.qid?(P.local.rep?`<p class="hint">Thanks! Reported.</p>`:`<details class="repbox"><summary>Something wrong with this question?</summary><div><input id="repn" maxlength="200" placeholder="What’s wrong? (optional)"><button data-a="report">Report</button></div></details>`):""}</div>`);if(v.ok&&navigator.vibrate)navigator.vibrate([40,40,80]);break;
  case "end":card2(`<div class="center"><p class="sub">You finished</p><div class="place">${esc(v.place)}</div><p class="sub">with ${esc(v.score)} points</p><h2>${esc(v.winner)} win${/ and /.test(v.winner)?"":"s"}!</h2>${mx(v.host)}</div>`);break;
  default:card2(`<div class="center"><h2>Eyes on the screen</h2></div>`);
 }}

/* ---------- taps ---------- */
const A={
 again:()=>{location.href=location.pathname;},
 team:v=>send({t:"team",team:+v}),
 start:()=>send({t:"start"}),
 ready:()=>send({t:"ready"}),
 next:(v,b)=>{b.disabled=true;send({t:"next"});},
 cat:(v,b)=>{send({t:"cat",k:v});document.querySelectorAll(".cbtn").forEach(x=>x.disabled=x!==b);card(`<div class="center"><h2>${esc(b.textContent)}!</h2><p class="sub">Your question is on the TV.</p></div>`);},
 pick:(v,b)=>{if(P.local.sent)return;P.local.sent=true;send({t:"pick",i:+v});b.classList.add("sel");$("#ans").classList.add("done");document.querySelectorAll(".abtn").forEach(x=>x.disabled=x!==b);$("#note").textContent="Locked in. Look at the TV!";},
 seq:(v,b)=>{const o=P.local.order||(P.local.order=[]),k=+v,at=o.indexOf(k);if(P.local.sent)return;if(at>-1)o.splice(at);else o.push(k);
  document.querySelectorAll(".seq .abtn").forEach(x=>{const j=+x.dataset.v,p=o.indexOf(j);x.classList.toggle("un",p<0);x.querySelector("b").textContent=p>-1?p+1:"";});
  if(o.length===P.v.items.length){P.local.sent=true;send({t:"seq",order:o});document.querySelectorAll(".seq .abtn").forEach(x=>x.disabled=true);}},
 life:(v,b)=>{send({t:"life",k:v});document.querySelectorAll(".lbtn").forEach(x=>x.disabled=true);},
 report:()=>{const n=$("#repn");send({t:"report",id:P.v.qid,note:n?n.value.trim():""});P.local.rep=true;render();},
 rpick:(v,b)=>{if(P.local.sent)return;P.local.sent=true;P.local.pick=+v;send({t:"rpick",q:P.v.qn,i:+v});document.querySelectorAll("#ans .abtn").forEach(x=>x.disabled=x!==b);b.classList.add("sel");},
 hpick:(v,b)=>{if(P.local.sent)return;P.local.sent=true;P.local.pick=+v;send({t:"hpick",k:P.v.k,x:+v});document.querySelectorAll(".dbtn").forEach(x=>x.disabled=true);b.classList.add("sel");},
 dod:(v,b)=>{if(P.local.sent)return;P.local.sent=true;P.local.pick=+v;send({t:"dod",k:P.v.k,s:+v});document.querySelectorAll(".dbtn").forEach(x=>x.disabled=true);b.classList.add("sel");const n=$("#note");if(n)n.textContent="Locked in. Eyes on the TV!";if(navigator.vibrate)navigator.vibrate(30);},
 sab:v=>{send({t:"sab",k:v});document.querySelectorAll(".sbtn").forEach(x=>x.disabled=true);},
 buzz:b=>{if(P.local.sent)return;P.local.sent=true;send({t:"buzz"});b.classList.add("hit");b.textContent="Buzzed!";if(navigator.vibrate)navigator.vibrate(60);}
};
document.addEventListener("pointerdown",e=>{const b=e.target.closest('[data-a="buzz"]');if(b&&!b.disabled){e.preventDefault();A.buzz(b);}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled||b.dataset.a==="buzz")return;const f=A[b.dataset.a];if(f)f(b.dataset.v,b);});
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&$("#bz")&&!$("#bz").disabled&&!e.target.closest("input")){e.preventDefault();A.buzz($("#bz"));}});

if(P.room&&P.name)join();else form();
}
</script>
</body>
</html>
