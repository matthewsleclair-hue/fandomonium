<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fandomonium</title>
<style>
/*FONTS*/
/* VOICE occasion: a loud, warm game-night show on the living-room TV
   IDEA a movie palace: velvet curtains that part between rounds, a bulb-lit marquee screen, admit-one tickets for scores
   PICTURE the marquee screen itself, ringed with chasing bulbs, holding the live question, sliding letter tiles, clues and emoji
   COLOUR velvet red ground, ivory screen, butter-yellow bulbs; one bright ticket colour per team
   TYPE Bungee marquee lettering + Rubik for questions and answers
   LAYOUT laptop/TV: header, ticket row, big screen, buzzer row; phone: same stack, tickets two-up, one answer column */
:root{color-scheme:dark;--v1:#4c0711;--v2:#7a0d1e;--v3:#a3172c;--iv:#fff8ec;--iv2:#f4e7d0;--line:#e5d6bb;--line2:#d4c2a2;--ink:#24110f;--mut:#6f5753;--but:#ffd23f;--ok:#12854f;--no:#c8233a;--disp:'Bungee',Impact,'Arial Black',sans-serif;--emoji:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;--notch:radial-gradient(circle 9px at 0 50%,#0000 96%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 96%,#000) right/51% 100% no-repeat}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 55% at 50% -8%,rgba(255,210,63,.2),transparent 62%),linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.4)),repeating-linear-gradient(90deg,var(--v1) 0,var(--v2) 26px,var(--v3) 42px,var(--v2) 58px,var(--v1) 84px);background-color:var(--v1);color:#fff;font:16px/1.5 Rubik,system-ui,'Segoe UI',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
input{user-select:text}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--but);outline-offset:2px}
[hidden]{display:none!important}
.spots{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.spots i{position:absolute;top:-14vh;width:44vw;height:135vh;background:linear-gradient(rgba(255,232,160,.17),rgba(255,232,160,0) 78%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;will-change:transform}
.spots i:first-child{left:-4vw;animation:swL 17s ease-in-out infinite alternate}
.spots i:last-child{right:-4vw;animation:swR 13s ease-in-out infinite alternate}
@keyframes swL{from{transform:rotate(30deg)}to{transform:rotate(-4deg)}}
@keyframes swR{from{transform:rotate(-30deg)}to{transform:rotate(6deg)}}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;padding:10px max(16px,3vw) 14px;max-width:1320px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:19px;color:var(--but);text-shadow:0 0 14px rgba(255,210,63,.55);white-space:nowrap}
.brand svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(255,210,63,.6))}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,220,150,.32);background:rgba(30,2,7,.4);color:#fff;font-size:14px;font-weight:500;transition:background .15s,transform .15s}
.tb:hover{background:rgba(30,2,7,.7)}
.tb:active{transform:scale(.96)}
.tb svg{width:18px;height:18px;flex:none}
.tickets{display:flex;gap:12px;flex-wrap:wrap}
.tk{position:relative;flex:1 1 160px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px 9px 22px;background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--c);color:var(--ink);border-radius:7px;-webkit-mask:var(--notch);mask:var(--notch);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),filter .3s}
.tk.dim{filter:saturate(.45) brightness(.8)}
.tk.on{transform:translateY(-3px) scale(1.025)}
.tk b{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;line-height:1.2;overflow:hidden;white-space:nowrap}
.tk b span{overflow:hidden;text-overflow:ellipsis}
.tk small{display:block;font-size:13px;opacity:.8}
.crown{width:18px;height:18px;flex:none;color:#6b3f00}
.crown svg{display:block;width:100%;height:100%}
.tk .sc{font-family:var(--disp);font-size:26px;font-variant-numeric:tabular-nums;border-left:2px dashed rgba(36,17,15,.35);padding-left:12px;white-space:nowrap;min-width:3.4ch;text-align:right}
.tk.bump .sc{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.3)}}
.stage{min-height:0;display:flex}
.frame{position:relative;isolation:isolate;flex:1;min-height:0;display:flex;padding:18px;border-radius:28px;background:linear-gradient(#470914,#2a050b);box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,210,63,.4)}
svg.lights{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.lights .h{fill:rgba(255,196,60,.26)}
.lights .o{fill:#fff4c4;stroke:#e3a21c;stroke-width:1.4}
.lights .a{animation:blA 1.3s steps(1) infinite}
.lights .b{animation:blB 1.3s steps(1) infinite}
@keyframes blA{0%{opacity:1}50%{opacity:.28}}
@keyframes blB{0%{opacity:.28}50%{opacity:1}}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;background:radial-gradient(120% 80% at 50% 0,#fffdf7,var(--iv) 60%);color:var(--ink);border-radius:14px;padding:clamp(16px,3vw,34px);box-shadow:0 0 0 3px #2a050b;scrollbar-width:thin}
.pane{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
.sign{position:relative;isolation:isolate;border-radius:22px;padding:26px 24px 22px;background:radial-gradient(80% 130% at 50% 0,#951829,#4a0812);text-align:center;box-shadow:0 7px 0 #2f040b}
.sign>:not(svg){position:relative;z-index:1}
.sign h1{font-family:var(--disp);font-weight:400;font-size:clamp(28px,min(7.4vw,9vh),82px);line-height:.95;margin:0;color:var(--but);text-shadow:0 0 22px rgba(255,210,63,.55),0 5px 0 #3a0610}
.sign p{margin:10px auto 0;color:#ffe7c0;font-size:clamp(15px,1.6vw,18px);max-width:72ch}
.setup{display:grid;gap:20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:30px}
h3{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--mut)}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px 10px 6px 20px;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--c);border-radius:8px;-webkit-mask:var(--notch);mask:var(--notch);animation:enter .35s both}
.trow input{flex:1;background:rgba(255,255,255,.6);border:0;border-radius:8px;min-height:44px;padding:0 12px;font:inherit;font-weight:600;font-size:17px;color:var(--ink)}
.trow input:focus{background:#fff;outline:2px solid var(--ink)}
.key{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:rgba(36,17,15,.88);color:var(--but);font-family:var(--disp);font-size:17px}
.x{flex:none;width:36px;height:44px;border:0;background:transparent;color:rgba(36,17,15,.7);font-size:26px;line-height:1;border-radius:8px}
.x:hover{background:rgba(36,17,15,.1)}
.add,.ghost{min-height:46px;border-radius:12px;border:2px solid var(--line2);background:#fff;color:var(--ink);font-weight:600;transition:transform .12s,background .12s}
.add{width:100%;border-style:dashed;background:transparent}
.add:hover,.ghost:hover{background:#fff;transform:translateY(-1px)}
.ghost{padding:0 20px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left;font-weight:600;color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .12s,opacity .2s,box-shadow .12s}
.cat:hover{transform:translateY(-2px)}
.cat .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.cat .ic svg{width:21px;height:21px}
.ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:#fff}
.ck svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.cat[aria-pressed=true]{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
.cat[aria-pressed=true] .ck{background:var(--c);border-color:var(--c)}
.cat[aria-pressed=true] .ck svg{opacity:1}
.cat[aria-pressed=false]{opacity:.55;background:transparent;box-shadow:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;line-height:1.15;transition:background .15s,color .15s}
.seg small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.seg [aria-pressed=true]{background:var(--ink);color:var(--iv);border-color:var(--ink)}
.seg [aria-pressed=true] small{color:#e8d8c4}
.go,.next{position:relative;overflow:hidden;border:0;font-family:var(--disp);color:var(--but);background:linear-gradient(#a8192f,#7a0d1e);text-shadow:0 2px 0 #3a0610;transition:transform .12s,box-shadow .12s;white-space:nowrap}
.go{font-size:24px;min-height:66px;padding:0 32px;border-radius:16px;box-shadow:0 6px 0 #4c0711,0 12px 26px rgba(122,13,30,.35)}
.next{font-size:18px;min-height:54px;padding:0 26px;border-radius:13px;box-shadow:0 5px 0 #4c0711}
.go::after,.next::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,62%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(600%)}}
.go:hover,.next:hover{transform:translateY(-2px)}
.go:active,.next:active{transform:translateY(4px);box-shadow:0 2px 0 #4c0711}
.how{margin-top:16px;font-size:15px;color:var(--mut)}
.how summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:32px}
.how ul{margin:6px 0 0;padding-left:20px}
.qh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px 5px 8px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.chip svg{width:18px;height:18px}
.kind{font-weight:600;color:var(--mut);font-size:15px}
.pts{margin-left:auto;font-family:var(--disp);font-size:32px;line-height:1;color:var(--v2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts small{font-family:Rubik,sans-serif;font-size:13px;color:var(--mut);margin-left:5px}
.barw{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bar{position:relative;flex:1;height:14px;border-radius:99px;background:#ead9bb;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.bar i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#ffae22,var(--but));transform-origin:left center;will-change:transform}
.bar.low i{background:linear-gradient(90deg,#a8152b,#ec4b61)}
.secs{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--but);font-family:var(--disp);font-size:18px;font-variant-numeric:tabular-nums}
.bar.low+.secs{background:var(--no);color:#fff;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.q{font-size:clamp(22px,1.6vw + 1.8vh,46px);line-height:1.18;margin:0 0 20px;font-weight:700;text-wrap:balance}
.tip{margin:-10px 0 16px;color:var(--mut)}
.ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;perspective:900px}
.ch.one{grid-template-columns:minmax(0,1fr)}
.ch button{display:flex;align-items:center;gap:12px;min-height:clamp(56px,8.5vh,100px);padding:10px 14px;border-radius:15px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:clamp(17px,.9vw + 1.1vh,28px);font-weight:600;text-align:left;line-height:1.25;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s,border-color .12s,background-color .25s;animation:deal .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*70ms + 120ms)}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotateX(-25deg)}}
.ch button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--line2);box-shadow:0 6px 0 var(--line2)}
.ch button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.ch button:disabled{cursor:default}
.ch .k{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--iv2);font-family:var(--disp);font-size:15px;transition:background-color .2s,color .2s}
.ch .picked{border-color:var(--ink)}
.ch .picked .k{background:var(--ink);color:var(--but)}
.ch .good{background:#dcf3e6;border-color:var(--ok);box-shadow:0 4px 0 #8fd0ad;animation:glow 1.1s ease-out}
.ch .good .k{background:var(--ok);color:#fff}
.ch .bad{background:#fbe1e4;border-color:var(--no);box-shadow:0 4px 0 #f0a5ae;animation:shake .45s}
.ch .bad .k{background:var(--no);color:#fff}
.ch .gone{opacity:.38;text-decoration:line-through;animation:none}
@keyframes glow{0%{box-shadow:0 4px 0 #8fd0ad,0 0 0 0 rgba(18,133,79,.55)}100%{box-shadow:0 4px 0 #8fd0ad,0 0 0 20px rgba(18,133,79,0)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.res{margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--iv2);animation:enter .35s both}
.res p{margin:0;flex:1 1 260px;font-size:clamp(18px,.7vw + 1vh,26px);font-weight:500}
.res.win{background:#dcf3e6}
.ready{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px;padding:16px;border-radius:16px;background:var(--iv2);animation:enter .35s .15s both}
.ready p{margin:0;flex:1 1 280px;font-size:17px}
.kchips{display:flex;gap:8px;flex-wrap:wrap;flex-basis:100%;order:3}
.kchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--c);font-weight:600;font-size:14px}
.kchip b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(36,17,15,.88);color:var(--but);font-family:var(--disp);font-weight:400}
.count{font-family:var(--disp);font-size:84px;line-height:1;text-align:center;color:var(--v2);margin-top:12px;animation:countpop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes countpop{from{transform:scale(2.2);opacity:0}}
.scr{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 30px;margin:16px 0 10px}
.word{position:relative;flex:none}
.tile{position:absolute;left:0;top:0;display:grid;place-items:center;border-radius:11px;background-color:var(--ink);background-image:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0) 55%);color:var(--iv);font-family:var(--disp);box-shadow:0 4px 0 #000;transition:transform .65s cubic-bezier(.3,1.35,.5,1),background-color .35s,color .35s,box-shadow .35s;will-change:transform}
.tile.ok{background-color:var(--but);color:var(--ink);box-shadow:0 4px 0 #b78900}
.tile.cov{color:#8c7470}
.hint{text-align:center;color:var(--mut);margin:8px 0 0;font-weight:600}
.clues{list-style:none;padding:0;margin:0;display:grid;gap:8px;perspective:900px}
.clues li{display:flex;gap:12px;align-items:center;padding:9px 14px;border-radius:13px;background:#fff;border:2px solid var(--line);font-size:clamp(17px,.9vw + 1.2vh,28px);font-weight:600;line-height:1.3;transform-origin:50% 0}
.clues .k{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--v2);color:var(--but);font-family:var(--disp);font-size:15px}
.clues li.hid{background:transparent;border-style:dashed;color:#ab948c;font-weight:500}
.clues li.hid .k{background:var(--iv2);color:#ab948c}
.clues li.new{animation:flip .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flip{from{transform:rotateX(-85deg);opacity:0}}
.emo{display:flex;justify-content:center;gap:clamp(10px,2vw,22px);flex-wrap:wrap;margin:14px 0;perspective:900px}
.emo span{width:clamp(80px,min(14vw,19vh),176px);aspect-ratio:1;display:grid;place-items:center;font-family:var(--emoji);font-size:clamp(46px,min(8.5vw,11.5vh),110px);line-height:1;border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.emo span.hid{font-family:var(--disp);color:#cdb790;font-size:clamp(30px,5vw,48px);border-style:dashed;background:transparent;box-shadow:none}
.emo span.new{animation:flipY .6s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes flipY{from{transform:rotateY(-95deg) scale(.8);opacity:0}}
.bz{margin-top:18px;padding:14px 16px;border-radius:16px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);animation:enter .3s both}
.bz h4{margin:0;font-size:22px}
.bz p{margin:2px 0 12px;color:var(--mut)}
.judge{display:flex;gap:10px;flex-wrap:wrap}
.judge button{flex:1 1 150px;min-height:56px;border-radius:13px;border:0;font-weight:700;font-size:18px;color:#fff;transition:transform .12s}
.judge button:hover{transform:translateY(-2px)}
.yes{background:var(--ok);box-shadow:0 4px 0 #0a5533}
.no{background:var(--no);box-shadow:0 4px 0 #7d1322}
.reveal{background:var(--ink);box-shadow:0 4px 0 #000}
.miss{margin:18px 0 0;font-weight:600;color:var(--no);font-size:17px;animation:enter .3s both}
.buzzers{display:flex;justify-content:center;gap:clamp(14px,4vw,46px);flex-wrap:wrap;animation:enter .4s both}
.bzr{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:#fff;padding:0;width:clamp(74px,12vw,112px)}
.bzr .cap{width:clamp(62px,10vw,88px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:clamp(22px,3.2vw,30px);color:var(--ink);background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.75) 0 11%,transparent 12%),radial-gradient(circle at 50% 42%,var(--c),color-mix(in srgb,var(--c) 66%,#000));box-shadow:0 7px 0 color-mix(in srgb,var(--c) 40%,#000),0 12px 18px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s,filter .3s}
.bzr:active:not(:disabled) .cap,.bzr.hit .cap{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 40%,#000),0 4px 8px rgba(0,0,0,.4)}
.bzr .nm{font-size:13px;font-weight:600;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bzr:disabled{cursor:default}
.bzr.lock .cap{filter:grayscale(1) brightness(.5)}
.end{display:grid;gap:16px;justify-items:center;text-align:center}
.end .sub{margin:0;color:var(--mut);font-size:18px}
.trophy{width:clamp(76px,10vw,112px);height:auto;animation:countpop .7s .15s cubic-bezier(.2,1.4,.4,1) both}
.winner{font-family:var(--disp);font-size:clamp(34px,6.5vw,72px);line-height:1.05;padding:14px 42px;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--c);color:var(--ink);border-radius:10px;text-wrap:balance;max-width:100%;-webkit-mask:radial-gradient(circle 16px at 0 50%,#0000 96%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 50%,#0000 96%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 16px at 0 50%,#0000 96%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 50%,#0000 96%,#000) right/51% 100% no-repeat;animation:countpop .7s .3s cubic-bezier(.2,1.3,.4,1) both}
.stand{width:min(540px,100%);display:grid;gap:8px}
.stand .tk{flex:none;animation:enter .5s both;animation-delay:calc(var(--d)*110ms + 600ms)}
.endb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:enter .5s 1s both}
.curtains{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.curtains.shut{pointer-events:auto;cursor:pointer}
.cl,.cr{position:absolute;top:0;bottom:0;width:50.6%;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 72%,rgba(0,0,0,.45)),repeating-linear-gradient(90deg,#4f0612 0,#8a1225 17px,#bf263b 28px,#8a1225 39px,#4f0612 58px);transition:transform .7s cubic-bezier(.7,0,.25,1);will-change:transform}
.cl{left:0;transform:translateX(-101%);box-shadow:inset -50px 0 60px -30px rgba(0,0,0,.6)}
.cr{right:0;transform:translateX(101%);box-shadow:inset 50px 0 60px -30px rgba(0,0,0,.6)}
.cl::after,.cr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(#f3c650,#b07a14 70%) 0 0/100% 7px no-repeat,repeating-linear-gradient(90deg,#f0be44 0 3px,#9b6a10 3px 6px) 0 7px/100% 19px no-repeat}
.valance{position:absolute;left:0;right:0;top:0;height:74px;z-index:2;background:linear-gradient(#f0c04a,#f0c04a) 0 34px/100% 4px no-repeat,radial-gradient(44px 34px at 50% 0,#a3172c 97%,transparent 100%) 0 37px/88px 36px repeat-x,linear-gradient(#5a0814,#9c1529) 0 0/100% 38px no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));transform:translateY(-105%);transition:transform .5s cubic-bezier(.7,0,.25,1)}
.shut .cl,.shut .cr,.shut .valance{transform:none}
.ctext{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(40% 35% at 50% 50%,rgba(20,0,4,.45),transparent);opacity:0;transition:opacity .25s}
.shut .ctext{opacity:1;transition-delay:.35s}
.ln{font-family:var(--disp);font-size:clamp(30px,7.5vw,96px);line-height:1.02;color:var(--but);text-shadow:0 0 22px rgba(255,210,63,.5),0 5px 0 #3a0610;animation:zoom .55s cubic-bezier(.2,1.3,.4,1) both;max-width:15ch;text-wrap:balance;margin:0 auto}
.ln small{display:block;font-family:Rubik,sans-serif;font-size:clamp(16px,2vw,22px);color:#fff;margin:16px auto 0;text-shadow:0 2px 6px rgba(0,0,0,.6);max-width:40ch;line-height:1.4}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.banner{position:fixed;left:0;right:0;top:50%;z-index:35;display:grid;place-items:center;padding:30px 16px;background:linear-gradient(90deg,transparent,rgba(38,3,9,.95) 14%,rgba(38,3,9,.95) 86%,transparent);box-shadow:0 0 0 2px rgba(255,210,63,.25);cursor:pointer;text-align:center;transform:translateY(-50%);animation:bIn .45s cubic-bezier(.2,.9,.3,1.1) both}
.banner .ln{font-size:clamp(32px,6vw,72px)}
.banner.out{animation:bOut .35s ease-in both}
@keyframes bIn{from{opacity:0;transform:translateY(-50%) scaleY(.15)}}
@keyframes bOut{to{opacity:0;transform:translateY(-50%) translateX(10%)}}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(70% 60% at 50% 100%,var(--c,#fff),transparent 75%)}
.flash.go{animation:flashA .75s ease-out}
@keyframes flashA{0%{opacity:.8}100%{opacity:0}}
.pop{position:fixed;z-index:31;font-family:var(--disp);font-size:30px;color:var(--but);text-shadow:0 3px 0 #3a0610,0 0 14px rgba(255,210,63,.7);pointer-events:none;animation:rise 1.2s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.pop.neg{color:#ffb7c0}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:24px;background:rgba(38,3,9,.7);animation:fade .2s both}

.lobby{display:grid;gap:20px}

.qr{width:clamp(160px,24vh,260px);aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:#fff;padding:10px;border:2px solid var(--line)}
.qr svg{display:block;width:100%;height:100%}
.jurl{font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.rcode{display:flex;gap:10px;margin:14px 0 4px;min-height:clamp(64px,8.5vh,92px)}
.rcode span{width:clamp(54px,7vh,78px);height:clamp(64px,8.5vh,92px);display:grid;place-items:center;border-radius:12px;background-color:var(--ink);background-image:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0) 55%);color:var(--but);font-family:var(--disp);font-size:clamp(34px,5vh,52px);box-shadow:0 5px 0 #000;animation:deal .45s both}

.lteams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lteam{border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff}

.lteam li.vip::before{content:"★ ";color:#b98a00}

.catpick .cat{min-height:clamp(84px,13vh,140px);justify-content:center;font-size:clamp(18px,.9vw + 1.2vh,28px);animation:deal .45s both;animation-delay:calc(var(--d)*80ms + 100ms)}
.catpick .cat .ic{width:clamp(40px,6vh,60px);height:clamp(40px,6vh,60px)}
.catpick .cat .ic svg{width:60%;height:60%}
@media(max-width:720px){.cols{grid-template-columns:minmax(0,1fr)}.joinbox{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.rcode{justify-content:center}}
@media(max-width:640px){.ch{grid-template-columns:minmax(0,1fr)}.ch button{min-height:54px}}
@media(max-width:600px){.tb span{display:none}.tb{padding:0 12px}.tk{flex-basis:40%;padding:6px 14px 6px 16px}.tk .sc{font-size:21px}.frame{padding:14px;border-radius:20px}.pts{font-size:25px}.brand{font-size:16px}.sign{padding:26px 16px 22px}}

<script>
{
/*BANK*/
/*CATS*/
const ICON=Object.assign({check:'<path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',crown:'<path d="M3 18 2 7l5.5 4L12 4l4.5 7L22 7l-1 11z" fill="currentColor"/>'},FICON);
const TROPHY='<svg class="trophy" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 14h60v20c0 22-12 38-30 40-18-2-30-18-30-40z" fill="#ffc81f"/><path d="M60 74c-18-2-30-18-30-40V14h14v22c0 20 7 33 16 38z" fill="#ffe27a"/><path d="M30 22H14c0 18 8 28 20 30M90 22h16c0 18-8 28-20 30" fill="none" stroke="#e0a516" stroke-width="7" stroke-linecap="round"/><rect x="52" y="72" width="16" height="16" fill="#e0a516"/><rect x="36" y="88" width="48" height="12" rx="3" fill="#7a0d1e"/><rect x="30" y="100" width="60" height="10" rx="3" fill="#4c0711"/><path d="m60 30 4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#fff6cf"/></svg>';
const SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Sound on</span>';
const SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Sound off</span>';
const COLORS=["#ffd23f","#3ddbd0","#ff8db8","#9cc0ff"];
const KEYS=["Q","P","Z","M"];
const DEF_NAMES=["Snitch Seekers","Infinity Squad","Rebel Scum","Second Breakfast"];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- pools ---------- */
const POOL={turn:[],all:[]};
for(const c in BANK){const b=BANK[c];
 b.mc.forEach((x,i)=>POOL.turn.push({id:c+"m"+i,cat:c,d:x[0],kind:"mc",q:x[1],a:x[2],w:x.slice(3)}));
 b.odd.forEach((x,i)=>POOL.turn.push({id:c+"o"+i,cat:c,d:x[0],kind:"odd",q:x[1],a:x[2],w:x.slice(3)}));
 b.seq.forEach((x,i)=>POOL.turn.push({id:c+"s"+i,cat:c,d:x[0],kind:"seq",q:x[1],items:x[2]}));
 b.scr.forEach((x,i)=>POOL.all.push({id:c+"r"+i,cat:c,d:x[0],kind:"scr",a:x[1],hint:x[2]}));
 b.who.forEach((x,i)=>POOL.all.push({id:c+"w"+i,cat:c,d:x[0],kind:"who",a:x[1],clues:x[2],w:x[3]}));
 b.emo.forEach((x,i)=>POOL.all.push({id:c+"e"+i,cat:c,d:x[0],kind:"emo",a:x[1],e:x[2].split(" "),w:x[3],hint:x[4]||"Movie title"}));
}
const used=new Set(store.get("fs-used2",[]));
const DLAB={1:"Easy",2:"Medium",3:"Hard"};
function curDiff(){const d=String(S.diff||"2");if(d==="mix")return Math.min(3,1+Math.floor(S.round*3/Math.max(1,S.rounds)));return +d||2;}
// Fresh questions at the chosen difficulty first, then the nearest other level, before any repeats.
function draw(group,kind,cat){
 const base=POOL[group].filter(q=>S.cats.includes(q.cat)&&(!cat||q.cat===cat));
 let pool=base.filter(q=>!kind||q.kind===kind);if(!pool.length)pool=base;
 const d=curDiff(),order=d===1?[1,2,3]:d===2?[2,1,3]:[3,2,1];
 for(const x of order){const f=pool.filter(q=>q.d===x&&!used.has(q.id));if(f.length)return pickQ(f);}
 const x=order.find(v=>pool.some(q=>q.d===v)),all=pool.filter(q=>q.d===x);all.forEach(q=>used.delete(q.id));return pickQ(all);}
function pickQ(list){const cs=[...new Set(list.map(q=>q.cat))];let p=cs.filter(c=>c!==S.lastCat);if(!p.length)p=cs;
 const c=p[rand(p.length)],f=list.filter(q=>q.cat===c),q=f[rand(f.length)];used.add(q.id);S.lastCat=c;store.set("fs-used2",[...used]);return q;}

/* ---------- sound ---------- */
let ac=null,noise=null,muted=store.get("fs-muted",false);
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,vol,when){if(muted||!ac)return;try{const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function swish(dur,from,to,vol){if(muted||!ac)return;try{const t=ac.currentTime;if(!noise){noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type="bandpass";f.Q.value=.9;f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+dur+.05);}catch(e){}}
const sfx={
 tick:()=>tone(1100,.05,"square",.04),
 blip:()=>tone(660,.12,"triangle",.12),
 whoosh:()=>swish(.45,500,2600,.16),
 curtain:()=>swish(.8,260,900,.2),
 buzz:()=>{tone(150,.4,"sawtooth",.16);tone(156,.4,"sawtooth",.12);},
 good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.16,i*.08)),
 bad:()=>{tone(220,.22,"square",.09);tone(155,.4,"square",.09,.18);},
 fanfare:()=>[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.3,"triangle",.15,i*.13))
};
function sndBtn(){const b=$("#sndB");b.innerHTML=muted?SND_OFF:SND_ON;b.setAttribute("aria-pressed",String(!muted));}

/* ---------- clock ---------- */
let clk=null,timers=[];
function startClock(dur,tick,end){const c={dur,el:0,last:performance.now(),run:true,tick,end};clk=c;
 const loop=now=>{if(clk!==c)return;if(c.run)c.el+=Math.min(.1,(now-c.last)/1000);c.last=now;const p=Math.min(1,c.el/c.dur);c.tick(c.el,p);if(p>=1){clk=null;c.end();return;}requestAnimationFrame(loop);};
 requestAnimationFrame(loop);}
const stopClock=()=>{clk=null;};
const pauseClock=()=>{if(clk)clk.run=false;};
const resumeClock=()=>{if(clk){clk.run=true;clk.last=performance.now();}};
const later=(fn,ms)=>{timers.push(setTimeout(fn,ms));};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];};

/* ---------- state ---------- */
const set=Object.assign({teams:DEF_NAMES.slice(0,3),cats:Object.keys(CATS),rounds:5,diff:"2",phones:false,steals:true,catsV:2},store.get("fs-set",{}));
if(set.catsV!==2){Object.keys(CATS).forEach(k=>{if(!["hp","mcu","sw","dis","lotr"].includes(k)&&!set.cats.includes(k))set.cats.push(k);});set.catsV=2;}
set.cats=set.cats.filter(k=>CATS[k]);if(set.steals===undefined)set.steals=true;
let S={screen:"setup",cats:set.cats};
let cur=null,hist=[],cseq=null,bseq=null,lastLow=null,lastSec=null;
const saveSet=()=>store.set("fs-set",set);
const mult=()=>S.rounds>1&&S.round===S.rounds-1?2:1;
const isLast=()=>S.round===S.rounds-1&&S.step===S.teams.length;

/* ---------- marquee bulbs ---------- */
const NS="http://www.w3.org/2000/svg";
function drawLights(el){const svg=el.querySelector(":scope>svg.lights");if(!svg)return;const W=el.clientWidth,H=el.clientHeight;if(W<40||H<40)return;
 const d=9,r=Math.max(4,parseFloat(getComputedStyle(el).borderTopLeftRadius)-d);
 const path=document.createElementNS(NS,"path");
 path.setAttribute("d",`M${d+r} ${d}H${W-d-r}A${r} ${r} 0 0 1 ${W-d} ${d+r}V${H-d-r}A${r} ${r} 0 0 1 ${W-d-r} ${H-d}H${d+r}A${r} ${r} 0 0 1 ${d} ${H-d-r}V${d+r}A${r} ${r} 0 0 1 ${d+r} ${d}Z`);
 svg.innerHTML="";svg.appendChild(path);
 const L=path.getTotalLength(),n=Math.max(8,Math.round(L/22/2)*2),st=L/n;let a="",b="";

function play(){cur=null;stopClock();$("#buzzers").hidden=true;ticketsUpd();sync();
 const s=S.step,T=S.teams,lines=[];

function catPick(i){const opts=shuffle(S.cats).slice(0,3),c={team:i,phase:"cat",opts,done:false,dur:12};cur=c;ticketsUpd();
 setScreen(`<div class="qh"><span class="kind">${esc(S.teams[i].name)} picks the fandom</span></div><div class="barw"><div class="bar" id="bar"><i id="bi"></i></div><span class="secs" id="secs">${c.dur}</span></div><h2 class="q">Pick a fandom on your phone</h2><div class="catpick">${opts.map((k,n)=>`<button class="cat" style="--c:${CATS[k].c};--d:${n}" data-a="pickcat" data-v="${k}"><span class="ic">${ico(CATS[k].i)}</span>${esc(CATS[k].n)}</button>`).join("")}</div>`);

function myTurn(i,cat){const q=draw("turn",null,cat),m=mult(),seq=q.kind==="seq";
 const c={team:i,q,pts:(seq?300:200)*m,done:false,dur:seq?35:20,sec:99};cur=c;
 ticketsUpd();
 let body;
 if(seq){let it;do{it=shuffle(q.items);}while(it.join()===q.items.join());c.items=it;c.order=[];
  body=`<h2 class="q">${esc(q.q)}</h2><p class="tip">Tap them from first to last. Tap one again to take it back.</p><div class="ch one seq">${it.map((t,k)=>`<button data-a="seqp" data-v="${k}" style="--d:${k}"><span class="k"></span><span>${esc(t)}</span></button>`).join("")}</div>`;}
 else{c.ch=shuffle([q.a,...q.w]);
  body=`<h2 class="q">${esc(q.q)}</h2><div class="ch">${c.ch.map((t,k)=>`<button data-a="pick" data-v="${k}" style="--d:${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>`;}
 setScreen(qhead(q,DLAB[q.d]+" "+(seq?"put it in order":q.kind==="odd"?"odd one out":"trivia")+" for "+S.teams[i].name,c.pts,m)+`<div class="barw"><div class="bar" id="bar"><i id="bi"></i></div><span class="secs" id="secs">${c.dur}</span></div>`+body+`<div class="res" id="res" role="status" hidden></div>`);
 sync();
 later(()=>{if(cur!==c||c.done)return;startClock(c.dur,el=>{const left=c.dur-el;setBar(left/c.dur,left);const s=Math.ceil(left);if(s<=5&&s<c.sec&&s>0)sfx.tick();c.sec=s;},()=>turnEnd(seq?false:null));},650);}
function turnEnd(v){const c=cur;if(!c||c.done||(!c.ch&&!c.items))return;c.done=true;stopClock();const q=c.q,nm=S.teams[c.team].name,name=esc(nm);let ok,msg,plain;

  $$(".seq button").map(b=>{const k=+b.dataset.v,r=q.items.indexOf(c.items[k]);b.disabled=true;b.style.animation="none";b.querySelector(".k").textContent=r+1;b.classList.remove("picked");b.classList.add(c.order[r]===k?"good":"bad");return [r,b];}).sort((a,b)=>a[0]-b[0]).forEach(([,b])=>box.appendChild(b));
  const pre=c.order.length<c.items.length?"Time’s up! ":"Not quite. ";
  msg=ok?`<b>+${c.pts}</b> for ${name}. Perfect order!`:pre+"Here’s the right order.";
  plain=ok?`+${c.pts} for ${nm}. Perfect order!`:pre+"The right order is on the screen.";}
 else{ok=v!=null&&c.ch[v]===q.a;const pre=v==null?"Time’s up! ":"Not quite. ";
  if(!ok&&S.steals&&S.teams.length>1){startSteal(v,pre);return;}
  $$(".ch button").forEach((b,k)=>{b.disabled=true;if(c.ch[k]===q.a)b.classList.add("good");else if(k===v)b.classList.add("bad");});
  msg=ok?`<b>+${c.pts}</b> for ${name}!`:pre+`It’s <b>${esc(q.a)}</b>.`;
  plain=ok?`+${c.pts} for ${nm}!`:pre+`It’s ${q.a}.`;}
 c.result={team:c.team,ok,text:plain};
 if(ok){award(c.team,c.pts);sfx.good();}else sfx.bad();

/* ---------- steals ---------- */
function startSteal(v,pre){const c=cur;c.phase="steal";c.own=v;c.locked=new Set([c.team]);c.half=Math.round(c.pts/20)*10;
 $$(".ch button").forEach((b,k)=>{b.disabled=true;if(k===v)b.classList.add("bad");});sfx.bad();

function stealBuzz(i,phone){const c=cur;if(!c||c.phase!=="steal"||c.locked.has(i)||i>=S.teams.length)return;

 const b=$("#bz"+i);if(b){b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),300);}
 $$(".ch button").forEach((x,k)=>{x.disabled=k===c.own;});
 $("#res").innerHTML=`<p><b>${esc(S.teams[i].name)}</b> is stealing for ${c.half}! ${phone?"Pick on your phone, or tap here.":"Pick an answer."}</p>`;
 sync();
 startClock(12,el=>setBar(1-el/12,12-el),()=>{if(cur===c&&c.phase==="stealing")finishSteal(i,null);});}
function stealPick(k){const c=cur;if(!c||c.phase!=="stealing"||k===c.own||!(k>=0&&k<4))return;finishSteal(c.stealer,k);}
function finishSteal(i,k){const c=cur;if(!c||(c.phase!=="steal"&&c.phase!=="stealing"))return;stopClock();c.phase="over";buzzUpd();$("#buzzers").hidden=true;
 const q=c.q,ok=i!=null&&k!=null&&c.ch[k]===q.a,nm=i!=null?S.teams[i].name:"";
 $$(".ch button").forEach((b,j)=>{b.disabled=true;if(c.ch[j]===q.a)b.classList.add("good");else if(j===k)b.classList.add("bad");});
 let msg,plain;
 if(ok){award(i,c.half);sfx.good();msg=`<b>Stolen!</b> +${c.half} for ${esc(nm)}.`;plain=`Stolen! +${c.half} for ${nm}.`;}
 else{sfx.bad();const lead=i==null?"Nobody stole it.":k==null?`Time’s up, ${nm}.`:`No steal for ${nm}.`;msg=`${esc(lead)} It’s <b>${esc(q.a)}</b>.`;plain=`${lead} It’s ${q.a}.`;}
 c.result={team:ok?i:null,ok,text:plain};

/* ---------- all play ---------- */
const KINDS=["who","scr","emo"];
function allPlay(){const kind=KINDS[S.round%3],q=draw("all",kind),m=mult();
 cur={team:null,q,max:500*m,min:100*m,val:500*m,locked:new Set(),struck:new Set(),phase:"ready",k:0};
 if(q.kind!=="scr")cur.opts=shuffle([q.a,...q.w]);
 const label={scr:"scramble",who:"Who am I?",emo:"emoji puzzle"}[q.kind];
 const how={scr:"Letters slide into place one by one. Buzz as soon as you can read it, then say it or type it on your phone.",who:"Clues appear one at a time, hardest first. Buzz in, then pick who it is.",emo:"Emojis appear one at a time. Buzz in, then pick the answer."}[q.kind];
 ticketsUpd();buzzers();
 setScreen(qhead(q,"All play: "+DLAB[q.d].toLowerCase()+" "+label,cur.max,m)+`<div class="barw"><div class="bar" id="bar"><i id="bi"></i></div></div><div id="ap"></div><div id="bzp"><div class="ready"><p>${how}</p><button class="next" data-a="apgo" data-primary>Start</button><div class="kchips">${S.teams.map((t,i)=>`<span class="kchip" style="--c:${t.color}"><b>${KEYS[i]}</b>${esc(t.name)}</span>`).join("")}</div></div></div><div class="res" id="res" role="status" hidden></div>`);
 if(q.kind==="scr")scrInit();

 $("#bzp .next").focus({preventScroll:true});
 sync();}
function apBuild(){const q=cur.q,box=$("#ap");
 if(q.kind==="scr"){scrRender();return;}
 if(q.kind==="who")box.innerHTML=`<ol class="clues">${q.clues.map((c,i)=>`<li class="hid" id="cl${i}"><span class="k">${i+1}</span><span>Clue ${i+1}</span></li>`).join("")}</ol>`;
 else box.innerHTML=`<div class="emo">${q.e.map((e,i)=>`<span class="hid" id="em${i}">?</span>`).join("")}</div><p class="hint">${esc(q.hint)}</p>`;}
function apShow(k){const q=cur.q,i=k-1;
 if(q.kind==="who"){const li=$("#cl"+i);if(li){li.className="new";li.innerHTML=`<span class="k">${k}</span><span>${esc(q.clues[i])}</span>`;}}
 else{const s=$("#em"+i);if(s){s.className="new";s.textContent=q.e[i];}}}
function apGo(){if(!cur||cur.phase!=="ready")return;cur.phase="count";sync();let n=3;
 const step=()=>{if(!cur||cur.phase!=="count")return;
  if(n===0){cur.phase="live";buzzUpd();$("#bzp").innerHTML="";
   const q=cur.q;if(q.kind==="scr"){cur.cover=false;$$(".tile").forEach(t=>{t.textContent=t.dataset.ch;t.classList.remove("cov");});scrPos();}else{cur.k=1;apShow(1);}
   const dur=q.kind==="scr"?24:q.kind==="who"?26:q.e.length*3.5+8;
   startClock(dur,apTick,()=>apFinish(null,"Time’s up! "));sync();return;}
  $("#bzp").innerHTML=`<div class="count">${n}</div>`;sfx.blip();n--;later(step,700);};
 step();}
function apTick(el,p){const c=cur;if(!c)return;const v=Math.round((c.max-(c.max-c.min)*p)/10)*10;if(v!==c.val){c.val=v;const e=$("#pv");if(e)e.textContent=v;}setBar(1-p);
 const q=c.q;
 if(q.kind==="scr"){const target=Math.floor(Math.min(1,p/.8)*c.n0);let moved=false;while(c.n0-scrLeft()<target&&scrStep())moved=true;if(moved)scrPos();}
 else{const n=q.kind==="who"?4:q.e.length,gap=q.kind==="who"?6:3.5,k=Math.min(n,Math.floor(el/gap)+1);while(c.k<k){c.k++;apShow(c.k);sfx.blip();}}}
/* scramble: each word keeps its own tiles; at[slot] = index of the tile sitting in that slot */
function scrInit(){cur.cover=true;cur.words=cur.q.a.split(" ").map(w=>{const n=w.length;let best=[...Array(n).keys()],bu=-1;
  for(let t=0;t<60;t++){const p=shuffle([...Array(n).keys()]),u=p.filter((x,i)=>w[x]!==w[i]).length;if(u>bu){bu=u;best=p;}if(u>=Math.ceil(n*.8))break;}
  return {w,at:best};});cur.n0=scrLeft();}
function scrLeft(){return cur.words.reduce((s,o)=>s+o.at.filter((t,i)=>o.w[t]!==o.w[i]).length,0);}
function scrStep(){const cand=[];cur.words.forEach((o,wi)=>o.at.forEach((t,s)=>{if(o.w[t]!==o.w[s])cand.push([wi,s]);}));if(!cand.length)return false;
 const [wi,s]=cand[rand(cand.length)],o=cur.words[wi],need=o.w[s],r=o.at.findIndex((t,x)=>x!==s&&o.w[t]===need&&o.w[t]!==o.w[x]);
 if(r<0)return false;[o.at[s],o.at[r]]=[o.at[r],o.at[s]];return true;}
function scrSize(){const W=($("#ap")||{}).clientWidth||600,L=Math.max(...cur.words.map(o=>o.w.length));return Math.max(22,Math.min(Math.round(Math.max(70,innerHeight*.1)),110,Math.floor(W/(L*1.13))));}
function scrRender(){const t=scrSize(),g=Math.round(t*.13),h=Math.round(t*1.18);cur.tile=[t,g];
 $("#ap").innerHTML=`<div class="scr">${cur.words.map((o,wi)=>`<div class="word" style="width:${o.w.length*(t+g)-g}px;height:${h}px">${[...o.w].map((ch,j)=>{const slot=o.at.indexOf(j),ok=!cur.cover&&o.w[j]===o.w[slot];return `<span class="tile${cur.cover?" cov":""}${ok?" ok":""}" id="t${wi}_${j}" data-ch="${esc(ch)}" style="width:${t}px;height:${h}px;font-size:${Math.round(t*.56)}px;transform:translateX(${slot*(t+g)}px)">${cur.cover?"?":esc(ch)}</span>`;}).join("")}</div>`).join("")}</div><p class="hint">${esc(cur.q.hint)}</p>`;}
function scrPos(){const [t,g]=cur.tile;cur.words.forEach((o,wi)=>o.at.forEach((tile,slot)=>{const el=document.getElementById(`t${wi}_${tile}`);if(!el)return;el.style.transform=`translateX(${slot*(t+g)}px)`;el.classList.toggle("ok",!cur.cover&&o.w[tile]===o.w[slot]);}));}
function apRevealAll(){const q=cur.q;if(q.kind==="scr"){if(cur.cover){cur.cover=false;$$(".tile").forEach(t=>{t.textContent=t.dataset.ch;t.classList.remove("cov");});}while(scrStep());scrPos();}
 else{const n=q.kind==="who"?4:q.e.length;while(cur.k<n){cur.k++;apShow(cur.k);}}}
function buzzers(){const f=$("#buzzers");f.hidden=false;f.innerHTML=S.teams.map((t,i)=>`<button class="bzr" id="bz${i}" data-a="bz" data-v="${i}" style="--c:${t.color}" aria-label="Buzz for ${esc(t.name)}, key ${KEYS[i]}" disabled><span class="cap">${KEYS[i]}</span><span class="nm">${esc(t.name)}</span></button>`).join("");}
function buzzUpd(){const open=!!cur&&(cur.phase==="live"||cur.phase==="steal");S.teams.forEach((t,i)=>{const b=$("#bz"+i);if(!b)return;b.classList.toggle("lock",!!cur&&!!cur.locked&&cur.locked.has(i));b.disabled=!open||cur.locked.has(i);});}
function buzz(i,phone){const c=cur;if(!c||c.phase!=="live"||c.locked.has(i)||i>=S.teams.length)return;
 c.phase="buzz";c.buzzed=i;c.viaPhone=!!phone;c.bzId=(c.bzId||0)+1;c.bzT=Date.now()+25000;pauseClock();sfx.buzz();buzzUpd();flash(S.teams[i].color);const b=$("#bz"+i);if(b){b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),300);}
 const tm=S.teams[i],scr=c.q.kind==="scr";
 const inner=scr?`<div class="judge"><button class="reveal" data-a="reveal"${phone?"":" data-primary"}>Show the answer</button></div>`
  :`<div class="ch">${c.opts.map((t,k)=>`<button data-a="apick" data-v="${k}" style="--d:${k}"${c.struck.has(k)?' disabled class="gone"':""}><span class="k">${"ABCD"[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>`;
 const sub=phone?(scr?"Typing their answer on their phone…":"Picking on their phone. You can tap for them here too."):(scr?"Shout your answer, then check it.":"Pick your answer.");
 $("#bzp").innerHTML=`<div class="bz" style="--c:${tm.color}"><h4>${esc(tm.name)} buzzed in for ${c.val}!</h4><p>${sub}</p>${inner}</div>`;
 $("#bzp .bz").scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"});
 sync();
 if(phone){const id=c.bzId;later(()=>{if(cur===c&&c.phase==="buzz"&&c.bzId===id)wrongBuzz(`Time’s up, ${tm.name}. Locked out!`);},25000);}}
function wrongBuzz(msg){const c=cur,i=c.buzzed;c.locked.add(i);sfx.bad();
 if(c.locked.size>=S.teams.length||(c.opts&&c.struck.size>=c.opts.length-1)){apFinish(null,c.locked.size>=S.teams.length?"Everyone’s locked out! ":"Out of guesses! ");return;}
 c.phase="live";c.viaPhone=false;buzzUpd();$("#bzp").innerHTML=`<p class="miss">${esc(msg)} Everyone else, keep watching.</p>`;resumeClock();sync();}
function apPick(k){const c=cur;if(!c||c.phase!=="buzz"||!c.opts||c.struck.has(k))return;
 if(c.opts[k]===c.q.a){apFinish(c.buzzed);return;}
 c.struck.add(k);wrongBuzz(`Wrong! ${S.teams[c.buzzed].name} is locked out.`);}
const normA=s=>String(s).toUpperCase().replace(/[^A-Z]/g,"");
function lev(a,b){let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}return p[b.length];}
function closeEnough(t,a){t=normA(t);a=normA(a);if(!t)return false;return t===a||lev(t,a)<=(a.length>=9?2:1);}
function scrTyped(text){const c=cur;if(!c||c.phase!=="buzz"||c.q.kind!=="scr")return;
 if(closeEnough(text,c.q.a)){apFinish(c.buzzed);return;}
 wrongBuzz(`${S.teams[c.buzzed].name} guessed “${String(text).trim().slice(0,40)||"nothing"}”. Locked out!`);}
function scrReveal(){const c=cur;if(!c||c.phase!=="buzz")return;c.phase="judge";apRevealAll();
 $("#bzp").innerHTML=`<div class="bz" style="--c:${S.teams[c.buzzed].color}"><h4>Did ${esc(S.teams[c.buzzed].name)} say ${esc(c.q.a)}?</h4><p>Close counts for spelling, not for a different name.</p><div class="judge"><button class="yes" data-a="yes">Yes, +${c.val}</button><button class="no" data-a="no">No</button></div></div>`;sync();}
function apFinish(winner,pre){const c=cur;if(!c||c.phase==="done")return;stopClock();c.phase="done";buzzUpd();apRevealAll();$("#bzp").innerHTML="";
 if(winner!=null){const nm=S.teams[winner].name;c.result={team:winner,ok:true,text:`+${c.val} for ${nm}! It’s ${c.q.a}.`};award(winner,c.val);sfx.good();showRes(`<b>+${c.val}</b> for ${esc(nm)}! It’s <b>${esc(c.q.a)}</b>.`,true);}
 else{c.result={team:null,ok:false,text:`${pre||""}Nobody scores this one. It was ${c.q.a}.`};sfx.bad();showRes(`${esc(pre||"")}Nobody scores this one. It was <b>${esc(c.q.a)}</b>.`,false);}}

/* ---------- end ---------- */
function ranking(){const r=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);return {r,place:t=>["1st","2nd","3rd","4th"][r.filter(x=>x.score>t.score).length]};}
function end(){stopClock();clearTimers();cur=null;S.screen="end";$("#buzzers").hidden=true;ticketsUpd();
 S.teams.forEach(t=>t.shown=t.score);
 const {r,place}=ranking(),top=r[0].score,w=r.filter(t=>t.score===top);
 setScreen(`<div class="end">${TROPHY}<p class="sub">And the winner is</p><div class="winner" style="--c:${w.length>1?"#ffd23f":w[0].color}">${w.length>1?"It’s a tie!":esc(w[0].name)}</div>${w.length>1?`<p class="sub">${w.map(t=>esc(t.name)).join(" and ")} share the top spot.</p>`:""}
 <div class="stand">${r.map((t,k)=>`<div class="tk" style="--c:${t.color};--d:${k}"><div><b><span>${place(t)}: ${esc(t.name)}</span></b></div><span class="sc">${t.score}</span></div>`).join("")}</div>
 <div class="endb"><button class="go" data-a="go" data-primary>Rematch</button><button class="ghost" data-a="newgame">Change teams or fandoms</button></div></div>`);
 sync();
 later(()=>{sfx.fanfare();confetti();},700);}
function confetti(){if(reduced())return;const cv=$("#cf"),x=cv.getContext("2d"),d=Math.min(2,devicePixelRatio||1);cv.hidden=false;
 const W=cv.width=innerWidth*d,H=cv.height=innerHeight*d,cols=[...COLORS,"#fff","#e23636"];
 const ps=Array.from({length:170},()=>({x:Math.random()*W,y:-Math.random()*H*.7,vx:(Math.random()-.5)*3*d,vy:(2+Math.random()*3)*d,s:(6+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[rand(cols.length)]}));
 const t0=performance.now();const f=now=>{x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035*d;p.vx*=.995;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
  if(now-t0<4500)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);cv.hidden=true;}};requestAnimationFrame(f);}
function quitAsk(){if(S.screen!=="play")return;pauseClock();const m=$("#modal");m.hidden=false;
 m.innerHTML=`<div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mh"><h2 id="mh">End this game?</h2><p style="margin:0">Scores will be lost.</p><div><button class="go" data-a="quitY">End game</button><button class="ghost" data-a="quitN">Keep playing</button></div></div>`;m.querySelector(".ghost").focus();}

/* ---------- phones ---------- */
const PH={c:null,bi:0,room:"",players:{},vip:null,sent:{},status:"off",hb:0,gen:0};
const ROOMCH="ABCDEFGHJKLMNPQRSTUVWXYZ";
const TP=s=>NET.prefix+PH.room+"/"+s;
const fresh=p=>Date.now()-p.seen<40000;
function teamPhones(i){return Object.values(PH.players).filter(p=>p.team===i&&fresh(p)).length;}
function emptiest(){let best=0,n=1e9;S.teams.forEach((t,i)=>{const k=Object.values(PH.players).filter(p=>p.team===i).length;if(k<n){n=k;best=i;}});return best;}
const validTeam=t=>S.teams&&Number.isInteger(t)&&t>=0&&t<S.teams.length;
const joinBase=()=>location.protocol.startsWith("http")&&/\/play\//.test(location.pathname)?location.href.replace(/\/play\/.*$/,"/join/"):NET.joinUrl;
function joinLink(){const o=NET.override();return joinBase()+"?r="+PH.room+"&b="+PH.bi+(o?"&broker="+encodeURIComponent(o):"");}
async function phonesStart(){if(PH.c||PH.status==="connecting")return;
 if(typeof mqtt==="undefined"||typeof NET==="undefined"){PH.status="fail";lobbyUpd();return;}
 if(!PH.room)PH.room=Array.from({length:4},()=>ROOMCH[rand(ROOMCH.length)]).join("");
 const gen=++PH.gen;PH.status="connecting";lobbyUpd();
 const o=NET.override(),urls=o?[o]:NET.brokers;
 for(let i=0;i<urls.length;i++){const c=await NET.connectOne(urls[i]);if(gen!==PH.gen){if(c)c.end(true);return;}if(!c)continue;
  PH.c=c;PH.bi=o?0:i;PH.status="up";
  c.on("message",(t,b)=>{if(t!==TP("h"))return;let m;try{m=JSON.parse(b.toString());}catch(e){return;}onPhone(m);});
  c.on("connect",()=>{PH.status="up";hello();PH.sent={};sync();lobbyUpd();});
  c.on("offline",()=>{PH.status="connecting";lobbyUpd();});
  c.subscribe(TP("h"),{qos:1});hello();clearInterval(PH.hb);PH.hb=setInterval(hello,30000);
  lobbyUpd();sync();return;}
 PH.status="fail";lobbyUpd();}
function hello(){if(PH.c)PH.c.publish(TP("hello"),JSON.stringify({room:PH.room,ts:Date.now(),title:"Fandomonium"}),{qos:1,retain:true});}
function phonesStop(){PH.gen++;clearInterval(PH.hb);if(PH.c){const c=PH.c;try{c.publish(TP("hello"),"",{qos:1,retain:true});}catch(e){}setTimeout(()=>{try{c.end(true);}catch(e){}},500);}
 PH.c=null;PH.status="off";PH.players={};PH.vip=null;PH.sent={};PH.room="";}
function onPhone(m){if(!m||!m.pid)return;NET.log("from phone",m.t);const pid=String(m.pid).slice(0,40);let p=PH.players[pid];
 if(m.t==="join"){if(!p)p=PH.players[pid]={name:"",team:null,seen:0};
  p.name=String(m.name||"Player").trim().slice(0,16)||"Player";p.seen=Date.now();
  const t=Number(m.team);if(!validTeam(p.team))p.team=validTeam(t)?t:emptiest();
  if(!PH.vip||!PH.players[PH.vip]||!fresh(PH.players[PH.vip]))PH.vip=pid;
  PH.sent[pid]=null;sendView(pid);lobbyUpd();ticketsUpd();return;}
 if(!p){if(PH.c)PH.c.publish(TP("p/"+pid),JSON.stringify({v:"rejoin"}),{qos:1});return;}
 p.seen=Date.now();const c=cur,mine=c&&c.team===p.team;
 switch(m.t){
  case "ping":sendView(pid,!!m.need);break;
  case "probe":sendView(pid,true);break;
  case "team":{const t=Number(m.team);if(S.screen==="lobby"&&validTeam(t)){p.team=t;lobbyUpd();sync();}break;}
  case "start":if(pid===PH.vip&&S.screen==="lobby")ACT.lobbyGo();break;
  case "cat":if(c&&c.phase==="cat"&&mine)chooseCat(String(m.k));break;
  case "pick":{const i=Number(m.i);if(!(i>=0&&i<4))break;
   if(c&&c.phase==="stealing"&&c.stealer===p.team)stealPick(i);
   else if(c&&c.ch&&!c.done&&mine)turnEnd(i);
   else if(c&&c.phase==="buzz"&&c.buzzed===p.team&&c.opts)apPick(i);break;}
  case "seq":if(c&&c.items&&!c.done&&mine&&Array.isArray(m.order)&&m.order.length===c.items.length&&new Set(m.order).size===c.items.length){c.order=m.order.map(Number);turnEnd(c.order.every((j,k)=>c.items[j]===c.q.items[k]));}break;
  case "buzz":if(c&&validTeam(p.team)){if(c.phase==="live")buzz(p.team,true);else if(c.phase==="steal")stealBuzz(p.team,true);}break;
  case "type":if(c&&c.phase==="buzz"&&c.buzzed===p.team)scrTyped(String(m.text||"").slice(0,60));break;
  case "ready":if(pid===PH.vip&&c&&c.phase==="ready")apGo();break;
  case "next":if(pid===PH.vip){const r=$("#res");if(r&&!r.hidden){const n=r.querySelector(".next");if(n)n.click();}}break;
 }}
const left=()=>clk?Math.max(0,clk.dur-clk.el):(cur&&cur.dur)||20;
function view(pid){const p=PH.players[pid],teams=S.teams||[];
 const base={room:PH.room,vip:pid===PH.vip,team:p.team,name:p.name,teams:teams.map(t=>({name:t.name,color:t.color})),score:validTeam(p.team)?teams[p.team].score:0};
 const V=o=>Object.assign(base,o),tn=i=>teams[i]?teams[i].name:"";
 if(S.screen==="lobby")return V({v:"lobby"});
 if(S.screen==="end"){const {r,place}=ranking(),me=r.find(t=>t.i===p.team);return V({v:"end",place:me?place(me):"",winner:r.filter(t=>t.score===r[0].score).map(t=>t.name).join(" and ")});}
 if(S.screen!=="play")return V({v:"wait",msg:"Hang tight",sub:"The host is setting up."});
 const c=cur,mine=c&&c.team===p.team;
 if(!c){if(S.step<teams.length&&S.step===p.team)return V({v:"wait",msg:"You’re up next!",sub:"Get ready."});
  if(S.step>=teams.length)return V({v:"wait",msg:"All play is coming",sub:"Get ready to buzz."});return V({v:"wait",msg:"Eyes on the screen",sub:tn(S.step)+" is up next."});}
 if(c.phase==="cat")return mine?V({v:"cat",opts:c.opts.map(k=>({k,n:CATS[k].n,c:CATS[k].c})),secs:left()}):V({v:"wait",msg:tn(c.team)+" is picking a fandom"});
 const res=()=>{const r=c.result||{};return V({v:"res",mine:r.team===p.team,ok:r.team===p.team&&!!r.ok,text:r.text||""});};
 if(c.phase==="steal")return mine?V({v:"wait",msg:"Other teams can steal it",sub:"Fingers crossed nobody knows."}):V({v:"buzz",steal:true,locked:false,val:c.half});
 if(c.phase==="stealing")return c.stealer===p.team?V({v:"mc",q:"Steal! "+c.q.q,ch:c.ch,struck:c.own!=null?[c.own]:[],secs:left(),pts:c.half}):V({v:"wait",msg:tn(c.stealer)+" is stealing",sub:c.q.q});
 if(c.team!=null&&c.ch){if(c.done)return res();return mine?V({v:"mc",q:c.q.q,ch:c.ch,secs:left(),pts:c.pts}):V({v:"wait",msg:tn(c.team)+" is answering",sub:c.q.q});}
 if(c.team!=null&&c.items){if(c.done)return res();return mine?V({v:"seq",q:c.q.q,items:c.items,secs:left(),pts:c.pts}):V({v:"wait",msg:tn(c.team)+" is putting things in order",sub:c.q.q});}
 if(c.phase==="ready"||c.phase==="count")return V({v:"ready",msg:"All play!",sub:"Thumbs on the buzzer."});
 if(c.phase==="live")return V({v:"buzz",locked:c.locked.has(p.team),val:c.val});
 if(c.phase==="buzz"||c.phase==="judge"){const secs=Math.max(0,(c.bzT-Date.now())/1000);
  if(c.buzzed===p.team&&c.viaPhone&&c.phase==="buzz")return c.q.kind==="scr"?V({v:"type",hint:c.q.hint,words:c.q.a.split(" ").map(w=>w.length),secs}):V({v:"mc",q:"You buzzed in! Pick your answer.",ch:c.opts,struck:[...c.struck],secs,pts:c.val});
  return V({v:"wait",msg:tn(c.buzzed)+" buzzed in",sub:c.locked.has(p.team)?"You’re locked out of this one.":"Fingers crossed they’re wrong."});}
 if(c.phase==="done")return res();
 return V({v:"wait",msg:"Eyes on the screen"});}
// Only resend when something other than the countdown changed, so phones never lose a half-entered answer.
function sendView(pid,force){if(!PH.c||PH.status!=="up"||!PH.players[pid])return;const v=view(pid),key=JSON.stringify(Object.assign({},v,{secs:0}));if(!force&&PH.sent[pid]===key)return;PH.sent[pid]=key;PH.c.publish(TP("p/"+pid),JSON.stringify(v),{qos:1});}
function sync(){if(PH.c)Object.keys(PH.players).forEach(sendView);}

/* ---------- lobby ---------- */
function lobby(){S.screen="lobby";cur=null;stopClock();$("#buzzers").hidden=true;ticketsUpd();
 Object.values(PH.players).forEach(p=>{if(!validTeam(p.team))p.team=emptiest();});
 setScreen(`<div class="lobby"><div class="joinbox"><div class="qr" id="qr" aria-label="QR code to join on your phone" role="img"></div><div><h2 class="q" style="margin:0 0 6px">Join on your phone</h2><p class="sub" style="margin:0">Scan the code, or go to <span class="jurl" id="jurl"></span> and enter</p><div class="rcode" id="rcode"></div><p class="pst" id="pst"></p></div></div>
 <div class="lteams" id="lteams"></div>
 <div class="endb"><button class="go" data-a="lobbyGo" data-primary>Start the game</button><button class="ghost" data-a="newgame">Back to setup</button></div>
 <p class="sub" style="margin:0;text-align:center">The first phone to join (★) can start rounds from the couch. Keyboard buzzers still work.</p></div>`);
 lobbyUpd();phonesStart();sync();}
function lobbyUpd(){if(S.screen!=="lobby"||!$("#lteams"))return;const up=PH.status==="up";
 const qr=$("#qr");if(up&&typeof qrcode!=="undefined"){const link=joinLink();if(qr.dataset.link!==link){try{const g=qrcode(0,"M");g.addData(link);g.make();qr.innerHTML=g.createSvgTag({cellSize:4,margin:0,scalable:true});qr.dataset.link=link;qr.setAttribute("data-join",link);}catch(e){qr.textContent="";}}}else if(!up){qr.innerHTML="";delete qr.dataset.link;}
 $("#rcode").innerHTML=up?[...PH.room].map(ch=>`<span>${ch}</span>`).join(""):"";
 $("#jurl").textContent=joinBase().replace(/^https?:\/\//,"").replace(/\/$/,"");
 const st=$("#pst");st.className="pst "+PH.status;
 st.innerHTML=`<i></i><span>${{up:"Ready for phones",connecting:"Connecting to the phone relay…",fail:"Couldn’t reach the phone relay. Check your internet, or start anyway and play with the keyboard.",off:"Starting…"}[PH.status]}</span>${PH.status==="fail"?'<button class="ghost" data-a="retry">Try again</button>':""}`;
 $("#lteams").innerHTML=S.teams.map((t,i)=>{const ps=Object.entries(PH.players).filter(([,p])=>p.team===i&&fresh(p));return `<div class="lteam" style="--c:${t.color}"><h4><span>${esc(t.name)}</span><span>${KEYS[i]}</span></h4><ul>${ps.length?ps.map(([id,p])=>`<li${id===PH.vip?' class="vip"':""}>${esc(p.name)}</li>`).join(""):'<li class="none">No phones yet</li>'}</ul></div>`;}).join("");}

/* ---------- actions ---------- */
const ACT={
 addT:()=>{if(set.teams.length<4){set.teams.push(DEF_NAMES[set.teams.length]);saveSet();drawSetup();}},
 rm:v=>{set.teams.splice(+v,1);saveSet();drawSetup();},
 cat:v=>{const i=set.cats.indexOf(v);if(i>-1)set.cats.splice(i,1);else set.cats.push(v);saveSet();drawSetup();},
 len:v=>{set.rounds=+v;saveSet();drawSetup();},
 diff:v=>{set.diff=String(v);saveSet();drawSetup();},
 ph:()=>{set.phones=!set.phones;saveSet();drawSetup();},
 go:()=>{if(!set.cats.length){toast("Pick at least one fandom");return;}unlock();
  S={screen:set.phones?"lobby":"play",teams:set.teams.map((n,i)=>({name:String(n).trim()||"Team "+(i+1),color:COLORS[i],score:0,shown:0})),rounds:set.rounds,round:0,step:0,cats:set.cats.slice(),diff:String(set.diff),steals:!!set.steals};hist=[];cur=null;
  if(set.phones)lobby();else{phonesStop();ticketsBuild();play();}},
 lobbyGo:()=>{if(S.screen!=="lobby")return;S.screen="play";Object.values(PH.players).forEach(p=>{if(!validTeam(p.team))p.team=emptiest();});ticketsBuild();play();},
 retry:()=>{PH.status="off";phonesStart();},
 pickcat:v=>chooseCat(v),
 newgame:()=>{phonesStop();setup();},
 next:()=>next(),
 pick:v=>{if(cur&&cur.phase==="stealing"){stealPick(+v);return;}if(cur&&!cur.done&&cur.ch)turnEnd(+v);},
 seqp:v=>{const c=cur;if(!c||c.done||!c.items)return;const k=+v,at=c.order.indexOf(k);if(at>-1)c.order=c.order.slice(0,at);else c.order.push(k);
  $$(".seq button").forEach(b=>{const j=+b.dataset.v,p=c.order.indexOf(j);b.classList.toggle("picked",p>-1);b.querySelector(".k").textContent=p>-1?p+1:"";});
  if(c.order.length===c.items.length)turnEnd(c.order.every((j,p)=>c.items[j]===c.q.items[p]));},
 apgo:()=>apGo(),
 bz:v=>{if(cur&&cur.phase==="steal")stealBuzz(+v,false);else buzz(+v,false);},
 st:()=>{set.steals=!set.steals;saveSet();drawSetup();},
 allc:()=>{set.cats=Object.keys(CATS);saveSet();drawSetup();},
 nonec:()=>{set.cats=[];saveSet();drawSetup();},
 apick:v=>apPick(+v),
 reveal:()=>scrReveal(),
 yes:()=>{if(cur&&cur.phase==="judge")apFinish(cur.buzzed);},
 no:()=>{if(cur&&cur.phase==="judge")apFinish(null,`Not it, ${S.teams[cur.buzzed].name}. `);},
 undo:()=>{const h=hist.pop();if(!h)return;S.teams[h.i].score-=h.pts;ticketsUpd();kickScores();popup(h.i,"−"+h.pts,true);toast(`Took back ${h.pts} from ${S.teams[h.i].name}`);sync();},
 snd:()=>{muted=!muted;store.set("fs-muted",muted);sndBtn();if(!muted){unlock();sfx.blip();}},
 fs:()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast("Full screen isn’t available here"));else if(!p)toast("Full screen isn’t available here");}}catch(e){toast("Full screen isn’t available here");}},
 quit:()=>quitAsk(),
 quitY:()=>{$("#modal").hidden=true;$("#curt").classList.remove("shut");phonesStop();setup();},
 quitN:()=>{$("#modal").hidden=true;resumeClock();}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;unlock();const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b);});
document.addEventListener("input",e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!=null){set.teams[+i]=e.target.value;saveSet();}});
document.addEventListener("keydown",e=>{
 if(e.target.matches&&e.target.matches("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key.length===1?e.key.toUpperCase():e.key;
 if(!$("#modal").hidden){if(k==="Escape")ACT.quitN();return;}
 if(cseq||bseq){if(k===" "||k==="Enter"){e.preventDefault();(cseq||bseq).skip();}return;}
 if(S.screen==="play"&&cur){
  const bi=KEYS.indexOf(k);if(bi>-1&&bi<S.teams.length&&(cur.phase==="live"||cur.phase==="steal")){e.preventDefault();unlock();if(cur.phase==="steal")stealBuzz(bi,false);else buzz(bi,false);return;}
  let n="1234".indexOf(k);if(n<0)n="ABCD".indexOf(k);
  if(n>-1){const bs=$$("#screen .ch button, #screen .catpick button");if(bs[n]&&!bs[n].disabled){e.preventDefault();bs[n].click();}return;}
 }
 if(k===" "||k==="Enter"){if(e.target.closest&&e.target.closest("button"))return;const p=$("#screen [data-primary]");if(p&&!p.closest("[hidden]")){e.preventDefault();p.click();}}
});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur&&cur.q&&cur.q.kind==="scr"&&cur.words&&$("#ap"))scrRender();},150);});
window.addEventListener("pagehide",()=>{if(PH.c){try{PH.c.publish(TP("hello"),"",{qos:0,retain:true});}catch(e){}}});

/* ---------- boot ---------- */
function start(data){sndBtn();unlock();watchLights($("#frame"));
 if(data&&data.set)Object.assign(set,data.set);
 if(data&&data.g&&data.g.teams){S={screen:"play",...data.g};S.teams.forEach(t=>t.shown=t.score);hist=[];cur=null;ticketsBuild();
  setScreen(`<div class="end">${TROPHY}<p class="sub">Game in progress</p><h2 class="q" style="margin:0">Round ${Math.min(S.round+1,S.rounds)} of ${S.rounds}</h2><div class="endb"><button class="go" data-a="next" data-primary>Keep playing</button><button class="ghost" data-a="newgame">New game</button></div></div>`);
  S.step--;}
 else setup();
 const c=$("#curt"),s={t:0};cseq=s;s.skip=()=>{if(cseq!==s)return;cseq=null;clearTimeout(s.t);c.classList.remove("shut");sfx.curtain();};s.t=setTimeout(s.skip,1500);}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({set,g:S.screen==="play"?{teams:S.teams,rounds:S.rounds,round:S.round,step:S.step,cats:S.cats,diff:S.diff}:null}));}catch(e){}}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
}
</script>
</body>
</html>
