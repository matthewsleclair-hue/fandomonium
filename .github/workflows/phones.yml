name: Phone test

# Plays whole games from simulated phones over the real public relay:
# three phones on teams, then six players each for themselves plus a latecomer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'build-web.js', 'build-site.js', '.github/workflows/phones.yml']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node build-site.js
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Play a full game from three phones
        run: mkdir -p shots && python test/e2e.py
        env:
          SHOTS: shots
      - name: Play every player for themselves with six phones
        run: mkdir -p shots-ffa && python test/e2e.py
        env:
          SHOTS: shots-ffa
          FFA: '1'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-test-screens
          path: |
            shots
            shots-ffa
