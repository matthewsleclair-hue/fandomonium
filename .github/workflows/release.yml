name: Windows build

# Publish a release on GitHub (Releases > Draft a new release, tag like v1.1.0)
# and this builds Fandomonium.exe on Windows and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" release/Fandomonium.exe --clobber
          if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
            gh release edit "$TAG" --notes-file .github/release-notes.md
          fi
